name: Run AI
description: Install and invoke the selected AI harness with a named model profile

inputs:
  harness:
    description: AI harness to install and invoke (copilot or opencode)
    default: copilot
  prompt:
    description: Task and invocation-specific context for the selected harness
    required: true
  profile:
    description: Model profile from .github/model-config.json
    default: default
  gh-token:
    description: Caller-selected token for repository, issue, and PR operations
    required: true

outputs:
  skipped:
    description: Whether the AI explicitly skipped before mutation
    value: ${{ steps.invoke.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Install selected AI harness
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        AI_HARNESS: ${{ inputs.harness }}
        GITHUB_TOKEN: ${{ inputs.harness == 'copilot' && github.token || '' }}
      run: |
        for attempt in 1 2 3; do
          if ./scripts/install-tools.sh "$AI_HARNESS"; then
            exit 0
          else
            status=$?
          fi

          if (( attempt == 3 )); then
            printf 'Error: AI-tool installation failed after 3 attempts (exit %s).\n' "$status" >&2
            exit "$status"
          fi

          delay=$((attempt * 5))
          printf 'AI-tool installation failed (exit %s); retrying in %ss (attempt %s/3).\n' \
            "$status" "$delay" "$((attempt + 1))" >&2
          sleep "$delay"
        done

    - name: Invoke AI
      id: invoke
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COPILOT_GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ inputs.gh-token }}
        AI_HARNESS: ${{ inputs.harness }}
        AI_PROFILE: ${{ inputs.profile }}
        AI_PROMPT: ${{ inputs.prompt }}
      run: |
        : "${GH_TOKEN:?gh-token is required}"
        ./scripts/ai.sh --harness "$AI_HARNESS" --profile "$AI_PROFILE" --prompt "$AI_PROMPT"
