name: Run AI
description: Install and invoke the selected AI harness with a named model profile

inputs:
  harness:
    description: AI harness to install and invoke (copilot or opencode)
    default: copilot
  prompt:
    description: Task and invocation-specific context for the selected harness
    required: true
  profile:
    description: Model profile from .github/model-config.json
    default: default
  budget:
    description: AI invocation budget in whole minutes (1-360), excluding installation
    required: true
  gh-token:
    description: Caller-selected token for repository, issue, and PR operations
    required: true

outputs:
  skipped:
    description: Whether the AI explicitly skipped before mutation
    value: ${{ steps.invoke.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Install selected AI harness
      shell: bash
      env:
        AI_HARNESS: ${{ inputs.harness }}
      run: ./scripts/install-tools.sh "$AI_HARNESS"

    - name: Invoke AI
      id: invoke
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COPILOT_GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ inputs.gh-token }}
        AI_HARNESS: ${{ inputs.harness }}
        AI_PROFILE: ${{ inputs.profile }}
        AI_PROMPT: ${{ inputs.prompt }}
        AI_BUDGET_MINUTES: ${{ inputs.budget }}
      run: |
        : "${GH_TOKEN:?gh-token is required}"
        if [[ ! "$AI_BUDGET_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] ||
          (( AI_BUDGET_MINUTES > 360 )); then
          echo "::error::budget must be a whole number of minutes from 1 to 360"
          exit 1
        fi
        started_at=$(date -u +%FT%TZ)
        AI_DEADLINE_UTC=$(date -u -d "$started_at $AI_BUDGET_MINUTES minutes" +%FT%TZ)
        export AI_DEADLINE_UTC
        printf 'AI invocation: started=%s budget_minutes=%s deadline=%s\n' \
          "$started_at" "$AI_BUDGET_MINUTES" "$AI_DEADLINE_UTC"
        AI_PROMPT+=$'\n\n'"Invocation budget: $AI_BUDGET_MINUTES minutes; deadline: $AI_DEADLINE_UTC. "
        AI_PROMPT+="Complete work, reporting, and verification before this deadline. "
        AI_PROMPT+="Give subtasks the remaining time and an earlier deadline, not a fresh budget. "
        AI_PROMPT+="AI_BUDGET_MINUTES and AI_DEADLINE_UTC are available in the environment. A timeout is a failure, not a skip."
        timeout --verbose --kill-after=30s "${AI_BUDGET_MINUTES}m" \
          ./scripts/ai.sh --harness "$AI_HARNESS" --profile "$AI_PROFILE" --prompt "$AI_PROMPT"
