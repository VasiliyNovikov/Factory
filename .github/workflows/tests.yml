name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
