name: Repository review

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  review:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: repository-review
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out invocation revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: factory
          persist-credentials: false

      - name: Set target context
        uses: ./factory/.github/actions/target-context
        with:
          target-repository: ${{ github.repository }}

      - name: Create Factory repository review token
        id: factory-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          owner: ${{ env.TARGET_OWNER }}
          repositories: ${{ env.TARGET_NAME }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Check out target source snapshot
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.FACTORY_SHA }}
          path: target
          token: ${{ steps.factory-token.outputs.token }}
          persist-credentials: false

      - name: Review the full repository with Copilot
        uses: ./factory/.github/actions/ai
        env:
          FACTORY_LOGIN: ${{ steps.factory-token.outputs.app-slug }}[bot]
        with:
          gh-token: ${{ steps.factory-token.outputs.token }}
          profile: review
          prompt: >-
            Review the full target source snapshot in TARGET_ROOT for ${{ env.TARGET_REPOSITORY }} from scratch
            and create issues for actionable improvements.
            Follow AGENTS.md and docs/factory/repository-review.md in FACTORY_ROOT.
