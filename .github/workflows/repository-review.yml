name: Repository review

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  review:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: repository-review
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out invocation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Create Factory repository review token
        id: factory-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Review the full repository with Copilot
        uses: ./.github/actions/run-copilot
        env:
          FACTORY_LOGIN: ${{ steps.factory-token.outputs.app-slug }}[bot]
        with:
          gh-token: ${{ steps.factory-token.outputs.token }}
          profile: review
          prompt: >-
            Review the full source snapshot of ${{ github.repository }} from scratch
            and create issues for actionable improvements.
            Follow repository guidance and docs/factory/repository-review.md.
