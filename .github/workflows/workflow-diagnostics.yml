name: Workflow diagnostics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  diagnose:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: workflow-diagnostics
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      copilot-requests: write
    steps:
      - name: Check out invocation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Create Factory diagnostics token
        id: factory-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Install AI tools
        run: ./scripts/install-tools.sh

      - name: Analyze workflows with parallel Copilot subagents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.factory-token.outputs.token }}
          FACTORY_LOGIN: ${{ steps.factory-token.outputs.app-slug }}[bot]
        run: >-
          ./scripts/ai.sh --harness copilot
          --prompt "Diagnose ${GITHUB_REPOSITORY}'s workflow runs and create issues for actionable findings.
          Follow repository guidance and docs/factory/workflow-diagnostics.md.
          Current run ID: ${GITHUB_RUN_ID}; attempt: ${GITHUB_RUN_ATTEMPT};
          Factory login: ${FACTORY_LOGIN}."
