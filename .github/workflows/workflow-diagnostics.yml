name: Workflow diagnostics

on:
  schedule:
    - cron: '7 0 */3 * *'
  workflow_dispatch:

jobs:
  diagnose:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: workflow-diagnostics
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      copilot-requests: write
    steps:
      - name: Check out invocation revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: factory
          persist-credentials: false

      - name: Set target context
        uses: ./factory/.github/actions/target-context
        with:
          target-repository: ${{ github.repository }}

      - name: Create Factory diagnostics token
        id: factory-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          owner: ${{ env.TARGET_OWNER }}
          repositories: ${{ env.TARGET_NAME }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Analyze workflows with parallel Copilot tasks
        id: diagnostics
        uses: ./factory/.github/actions/ai
        with:
          gh-token: ${{ steps.factory-token.outputs.token }}
          profile: default
          budget: 30
          prompt: >-
            Diagnose target ${{ env.TARGET_REPOSITORY }}'s workflow runs and create issues for actionable findings.
            Follow AGENTS.md and docs/factory/workflow-diagnostics.md in FACTORY_ROOT.
            Current run ID: ${{ github.run_id }}; attempt: ${{ github.run_attempt }};
            Factory login: ${{ steps.factory-token.outputs.app-slug }}[bot].

      - name: Report diagnostics interruption
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          {
            printf '## TL;DR\n\n'
            printf 'Workflow diagnostics failed or was interrupted (AI step: %s).\n\n' \
              "${DIAGNOSTICS_OUTCOME:-not started}"
            printf 'Run: %s/%s/actions/runs/%s/attempts/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '%s\n' \
              'Analysis is failed/incomplete, not a clean result or a skip.' \
              'A skipped AI step performed no analysis or publication in this attempt.' \
              'Use any coordinator checkpoints and logs as partial evidence only. Missing coverage, assessment task statuses, model/delegation binding, and publication disposition remain unknown.' \
              'This notice cannot reconstruct a lost final report or prove summary/log agreement or process cleanup.' \
              'Before rerunning the original invocation, reconcile findings in all states and earlier attempts; do not blindly replay issue creation.'
          } | tee -a "${GITHUB_STEP_SUMMARY:?summary path is required}"
