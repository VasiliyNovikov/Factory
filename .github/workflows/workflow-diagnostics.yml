name: Workflow diagnostics

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  diagnose:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: workflow-diagnostics
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      copilot-requests: write
    steps:
      - name: Check out invocation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Bind assessment subagents to the coordinator profile
        run: |
          copilot_home="$RUNNER_TEMP/workflow-diagnostics-copilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$copilot_home"
          cat > "$copilot_home/settings.json" <<'JSON'
          {
            "subagents": {
              "agents": {
                "explore": {
                  "model": "inherit",
                  "effortLevel": "inherit",
                  "contextTier": "inherit"
                }
              }
            }
          }
          JSON
          printf 'COPILOT_HOME=%s\n' "$copilot_home" >> "$GITHUB_ENV"

      - name: Create Factory diagnostics token
        id: factory-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Analyze workflows with parallel Copilot subagents
        uses: ./.github/actions/ai
        with:
          gh-token: ${{ steps.factory-token.outputs.token }}
          profile: default
          prompt: >-
            Diagnose ${{ github.repository }}'s workflow runs and create issues for actionable findings.
            Follow repository guidance and docs/factory/workflow-diagnostics.md.
            Current run ID: ${{ github.run_id }}; attempt: ${{ github.run_attempt }};
            Factory login: ${{ steps.factory-token.outputs.app-slug }}[bot].
