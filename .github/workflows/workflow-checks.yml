name: Workflow checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run workflow regression checks
        run: python3 -B -m unittest discover -s tests -v
