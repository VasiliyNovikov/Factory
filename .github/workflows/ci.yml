name: CI

on:
  workflow_dispatch:

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load model defaults
        run: |
          jq -r '{MODEL: .model, REASONING_EFFORT: .reasoningEffort, COPILOT_CONTEXT_TIER: (if .longContext then "long_context" else "default" end)} | to_entries[] | "\(.key)=\(.value)"' .github/model-config.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          copilot
          --model "$MODEL"
          --reasoning-effort "$REASONING_EFFORT"
          --context "$COPILOT_CONTEXT_TIER"
          --prompt "Report your current model ID, reasoning effort, and context window capacity in tokens. Use only information available in your session; report unknown for anything you cannot verify. Keep the response concise and do not use any tools."
          --allow-all-tools

      - name: Install OpenCode
        run: npm install -g opencode-ai@latest

      - name: Run OpenCode test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG_CONTENT: '{"provider":{"github-copilot":{"options":{"headers":{"Copilot-Integration-Id":"copilot-developer-cli"}}}}}'
        run: >-
          opencode run
          --model "github-copilot/$MODEL"
          --variant "$REASONING_EFFORT"
          "Report your current model ID, reasoning effort, and context window capacity in tokens. Use only information available in your session; report unknown for anything you cannot verify. Keep the response concise and do not use any tools."
