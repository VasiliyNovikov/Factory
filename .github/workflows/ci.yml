name: CI

on:
  workflow_dispatch:

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      copilot-requests: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: copilot --prompt "Reply with exactly 'Hello from CI'. Do not use any tools." --allow-all-tools
