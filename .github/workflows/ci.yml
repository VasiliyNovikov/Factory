name: CI

on:
  workflow_dispatch:

jobs:
  ai:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Create PR App token
        id: pr-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          token: ${{ steps.pr-app-token.outputs.token }}

      - name: Install AI tools
        run: ./scripts/install-tools.sh

      - name: Create test PR with Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.pr-app-token.outputs.token }}
          GIT_AUTHOR_NAME: factory[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: factory[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          ./scripts/ai.sh
          --harness copilot
          --prompt "Create a test pull request in repository ${GITHUB_REPOSITORY}. Fetch origin master and create branch ci/test-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} from origin/master. Create or update ci-pr-test.md with a short note and this run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Commit only that file with message 'Added CI PR creation test'. Push the new branch to origin, then use gh pr create to open exactly one PR against master with title 'test' and a body containing the run URL. Use the provided Git author and committer environment variables. Do not push to master or merge the PR. Actually create the PR and report its URL; report any failure accurately."
