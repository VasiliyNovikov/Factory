name: CI

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install AI tools
        run: ./scripts/install-tools.sh

      - name: Run Copilot test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/ai.sh
          --harness copilot
          --prompt "Report your current model ID, reasoning effort, and context window capacity in tokens. Use only information available in your session; report unknown for anything you cannot verify. Keep the response concise and do not use any tools."

      - name: Run OpenCode test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/ai.sh
          --harness opencode
          --prompt "Report your current model ID, reasoning effort, and context window capacity in tokens. Use only information available in your session; report unknown for anything you cannot verify. Keep the response concise and do not use any tools."
