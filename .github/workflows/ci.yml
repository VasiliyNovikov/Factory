name: CI

on:
  workflow_dispatch:

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      copilot-requests: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve Copilot CLI version
        id: copilot-version
        run: |
          version=$(npm view @github/copilot@latest version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Copilot CLI cache
        id: copilot-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/copilot-cli
          key: copilot-cli-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.copilot-version.outputs.version }}

      - name: Install GitHub Copilot CLI
        if: steps.copilot-cache.outputs.cache-hit != 'true'
        env:
          COPILOT_VERSION: ${{ steps.copilot-version.outputs.version }}
        run: npm install -g --prefix "$RUNNER_TEMP/copilot-cli" "@github/copilot@$COPILOT_VERSION"

      - name: Save Copilot CLI cache
        if: steps.copilot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/copilot-cli
          key: ${{ steps.copilot-cache.outputs.cache-primary-key }}

      - name: Add Copilot CLI to PATH
        run: echo "$RUNNER_TEMP/copilot-cli/bin" >> "$GITHUB_PATH"

      - name: Run Copilot test prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          copilot
          --model gpt-6-astra
          --reasoning-effort xhigh
          --context long_context
          --prompt "Report your current model ID, reasoning effort, and context window capacity in tokens. Use only information available in your session; report unknown for anything you cannot verify. Keep the response concise and do not use any tools."
          --allow-all-tools
